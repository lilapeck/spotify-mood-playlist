<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mood Playlist Generator</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 60px auto; color: #111; }
    h1 { font-size: 1.4rem; }
    textarea { width: 100%; height: 80px; font-size: 1rem; padding: 8px; box-sizing: border-box; }
    .row { margin-top: 16px; }
    button, .login-btn { background: #1DB954; color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .error { color: #b00020; margin-top: 12px; }
    fieldset { border: none; padding: 0; }
    label { margin-right: 16px; }
  </style>
</head>
<body>
  <h1>Mood &rarr; Playlist</h1>
  <p>Describe a mood or vibe. Tracks are pulled from your own top tracks or saved library and ranked by matching artist genres to the mood &mdash; no Spotify recommendation engine involved.</p>

  {% if not logged_in %}
    <a class="login-btn" href="{{ url_for('login') }}">Connect Spotify</a>
  {% else %}
    <form method="post" action="{{ url_for('generate') }}">
      <textarea name="mood" placeholder="e.g. rainy day coding, low-key but not sad" required></textarea>
      <div class="row">
        <fieldset>
          <label><input type="radio" name="pool" value="top_tracks" checked> My top tracks</label>
          <label><input type="radio" name="pool" value="saved"> My saved/liked songs</label>
        </fieldset>
      </div>
      <div class="row">
        <button type="submit">Generate playlist</button>
      </div>
    </form>
  {% endif %}

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
</body>
</html>
