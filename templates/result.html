<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mood Playlist Generator</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 60px auto; color: #111; }
    a.playlist-link { background: #1DB954; color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; text-decoration: none; display: inline-block; margin: 12px 0; }
    ol { padding-left: 20px; }
    li { margin-bottom: 6px; }
    .back { display: block; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Playlist for: "{{ mood }}"</h1>
  <a class="playlist-link" href="{{ playlist_url }}" target="_blank">Open in Spotify</a>
  <ol>
    {% for t in tracks %}
      <li>{{ t.name }} &mdash; {{ t.artist_names }}</li>
    {% endfor %}
  </ol>
  <a class="back" href="{{ url_for('index') }}">&larr; Generate another</a>
</body>
</html>
